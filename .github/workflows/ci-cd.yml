# CI/CD ShopWise : build + tests (back et front) + rapports de couverture, puis images Docker publiées sur DockerHub.
name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (Maven, tests, JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build et tests
        run: ./mvnw -B verify
      - name: Rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-rapports
          path: |
            target/surefire-reports/
            target/site/jacoco/

  frontend:
    name: Frontend (Angular, tests, couverture)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/shopWise_front_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/shopWise_front_app/package-lock.json
      - name: Installation
        run: npm ci
      - name: Tests et couverture (Chrome headless)
        run: npm run test:ci
      - name: Build production
        run: npx ng build --configuration production
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-couverture
          path: frontend/shopWise_front_app/coverage/

  docker:
    name: Images Docker -> DockerHub
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shopwise-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/shopwise-backend:${{ github.sha }}
      - name: Image frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend/shopWise_front_app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shopwise-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/shopwise-frontend:${{ github.sha }}
