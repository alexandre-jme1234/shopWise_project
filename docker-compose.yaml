services:
  mariadb:
    image: mariadb:11.4                # version LTS
    container_name: shopwise-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_PASSWORD: dev
      MARIADB_USER: shopWise
      MARIADB_DATABASE: shopwise_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql                                   # les données survivent aux redémarrages
      - ./src/main/resources/sql:/docker-entrypoint-initdb.d:ro  # tes scripts 01 et 02
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data: