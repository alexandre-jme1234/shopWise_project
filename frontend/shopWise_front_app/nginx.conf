server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # appels API -> conteneur "backend" (nom du service dans docker-compose.yml)
    location ~ ^/(shops|clients|auth)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # routes Angular (/rendez-vous, /clients...) : toujours renvoyer index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
