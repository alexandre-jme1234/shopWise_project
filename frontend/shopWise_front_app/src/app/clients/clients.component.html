<h1>Clients</h1>

<form class="filtres" (ngSubmit)="charger()">
  <label>Boutique <input type="number" name="shopId" [(ngModel)]="shopId" min="1"></label>
  <button type="submit">Afficher</button>
</form>

@if (erreur) { <p class="erreur">{{ erreur }}</p> }

<table>
  <thead><tr><th>N°</th><th>Nom</th><th>Email</th><th>Points</th></tr></thead>
  <tbody>
    @for (client of clients; track client.id) {
      <tr><td data-label="N°">{{ client.id }}</td><td data-label="Nom">{{ client.name }}</td><td data-label="Email">{{ client.email }}</td><td data-label="Points">{{ client.solde_points }}</td></tr>
    } @empty {
      <tr><td colspan="4">Aucun client</td></tr>
    }
  </tbody>
</table>
